name: CICD
on: 
  push:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: using_actions/react-app   
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: setup node
        uses: actions/setup-node@v6
        with:
          node-version: '24.x'
      - name: install dependencies
        run: npm ci
      - name: run test
        run: npm test                 