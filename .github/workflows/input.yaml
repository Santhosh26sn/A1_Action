name: CICD input
on:
  workflow_dispatch:
    inputs:
      debug:
        type: boolean
        description: skip deployment print only build        
        default: false
      target:
        type: environment
        description: target environment for deployment
        required: true
      tag:
        type: choice
        description: tag for deployment
        options:
          - v1
          - v2
          - v3
        default: v3
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: build tag
        run: echo "Build tag is  ${{ inputs.tag }}"
  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: ${{ !inputs.debug }}
    steps:
      - name: deploy
        run: echo "Deploy to ${{ inputs.target}} env"  
