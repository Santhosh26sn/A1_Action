name: Output CICD
on:
  workflow_dispatch:
    inputs:
      status:
        type: choice
        options:
          - success
          - failure
        default: success
jobs:
  display:
    runs-on: ubuntu-latest
    outputs:
      result: ${{ steps.set-output.outputs.status}}
    steps:
      - name: path
        run: echo "$GITHUB_OUTPUT"
      - name: Set output
        id: set-output
        run: echo "status=${{ inputs.status}}" >> $GITHUB_OUTPUT  
  
  build:
    needs: display
    runs-on: ubuntu-latest
    if: ${{ needs.display.outputs.result == 'success'}}
    steps:
      - name: build
        run: |
          echo "Build status is ${{ needs.display.outputs.result}}"
          echo "Deployed successfully"
