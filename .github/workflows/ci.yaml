name: Output CICD
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      status:
        type: choice
        options:
          - success
          - failure
        default: success
jobs:
  display:
    runs-on: ubuntu-latest
    outputs:
      result: ${{ steps.set-output.outputs.status}}
      output_1: ${{ steps.set-output.outputs.Test}}
    steps:
      - name: path
        run: echo "$GITHUB_OUTPUT"
      - name: Set output
        id: set-output
        run: |
          echo "status=${{ inputs.status}}" >> $GITHUB_OUTPUT  
          echo "Test: value_1" >> $GITHUB_OUTPUT
          echo "demo: value_2" >> $GITHUB_OUTPUT
          cat $GITHUB_OUTPUT
  
  build:
    needs: display
    runs-on: ubuntu-latest
    if: ${{ needs.display.outputs.result == 'success'}}
    steps:
      - name: build
        run: |
          echo "Build status is ${{ needs.display.outputs.result}}"
          echo "Deployed successfully"
          echo "Test is ${{ needs.display.outputs.output_1}}"
